apiVersion: agefreighter.io/v2
kind: LoadJob
metadata:
  name: secret-leak
source:
  type: csv
  namespace: crm
  csv:
    defaults: {}
    vertices:
      - label: Person
        path: people.csv
        idColumn: id
target:
  type: apache-age
  graph: crm_graph
  connection:
    value: postgresql://admin:supersecret@example.invalid/database
runtime: {}
errors: {}
