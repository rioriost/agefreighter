apiVersion: agefreighter.io/v2
kind: LoadJob
metadata:
  name: csv-people
source:
  type: csv
  namespace: crm
  csv:
    defaults:
      delimiter: ","
      quote: '"'
      escape: '"'
      header: true
      encoding: utf-8
      nullValue: ""
    vertices:
      - label: Person
        path: people.csv
        idColumn: person_id
        properties:
          name: full_name
          score: score
    edges:
      - label: KNOWS
        path: knows.csv
        externalIdColumn: relationship_id
        start:
          label: Person
          field: from_id
        end:
          label: Person
          field: to_id
        properties:
          since: since
target:
  type: apache-age
  graph: crm_graph
  mode: create
  connection:
    env: AGEFREIGHTER_TARGET_DSN
  propertyMode: replace
runtime:
  memoryLimit: 1GiB
  batchRows: 10000
  batchBytes: 16MiB
  maxSourceConcurrency: 2
  maxTransformConcurrency: 4
  maxTargetConnections: 2
  operationTimeout: 30s
errors:
  malformedRecord: quarantine
  missingEndpoint: error
  rejectLimit: 100
  quarantinePath: rejects.jsonl
