name: Release

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic v2 version to package (dispatch never publishes)"
        required: true
        default: "v2.3.0"
        type: string
      dry_run:
        description: "Required safety acknowledgement"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      epoch: ${{ steps.metadata.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate request and derive reproducible metadata
        id: metadata
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_TYPE" == "tag" ]]
            version="$GITHUB_REF_NAME"
            [[ "$(git rev-list -n 1 "$version")" == "$GITHUB_SHA" ]]
          else
            [[ "$DRY_RUN" == "true" ]]
            version="$DISPATCH_VERSION"
          fi
          [[ "$version" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          if [[ "$version" == *-* ]]; then
            IFS=. read -ra identifiers <<<"${version#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                printf 'numeric prerelease identifiers must not have leading zeroes\n' >&2
                exit 2
              fi
            done
          fi
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          build_date="$(date -u -d "@$epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          [[ "$build_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          {
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'build_date=%s\n' "$build_date"
            printf 'epoch=%s\n' "$epoch"
          } >>"$GITHUB_OUTPUT"

  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned quality tools
        run: make install-tools
      - name: Start pinned integration databases
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-up
      - name: Start pinned PostgreSQL 19 beta target
        env:
          PGGRAPH_CONTAINER: agefreighter-pg19-beta3
          PGGRAPH_IMAGE: docker.io/library/postgres@sha256:a48b19841e04b35b72a25e9a94314ac80546d32b5e2e3cd9279390cbd8a99572
          PGGRAPH_PASSWORD: agefreighter_pg19_dev_only
        run: |
          docker pull "$PGGRAPH_IMAGE"
          docker rm --force "$PGGRAPH_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --name "$PGGRAPH_CONTAINER" \
            --publish 55434:5432 \
            --env POSTGRES_PASSWORD="$PGGRAPH_PASSWORD" \
            --env POSTGRES_DB=agefreighter \
            "$PGGRAPH_IMAGE" >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$PGGRAPH_CONTAINER" \
              pg_isready -U postgres -d agefreighter >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$PGGRAPH_CONTAINER"
          exit 1
      - name: Run quality, compatibility, recovery, and performance gates
        env:
          AGEFREIGHTER_MINIMUM_CSV_ROWS_PER_SECOND: "50000"
          AGEFREIGHTER_MAXIMUM_CLIENT_RSS_BYTES: "2147483648"
          AGEFREIGHTER_PGGRAPH_TEST_DSN: postgres://postgres:agefreighter_pg19_dev_only@127.0.0.1:55434/agefreighter?sslmode=disable
        run: |
          . ./scripts/dev/services.sh
          export AGEFREIGHTER_AGE_TEST_DSN="postgres://agefreighter:${AGEFREIGHTER_DEV_PASSWORD}@127.0.0.1:${AGE_PORT}/agefreighter?sslmode=disable"
          export AGEFREIGHTER_POSTGRES_TEST_DSN="postgres://agefreighter:${AGEFREIGHTER_DEV_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/agefreighter?sslmode=disable"
          export AGEFREIGHTER_NEO4J_TEST_URI="bolt://127.0.0.1:${NEO4J_BOLT_PORT}"
          export AGEFREIGHTER_NEO4J_TEST_USERNAME=neo4j
          export AGEFREIGHTER_NEO4J_TEST_PASSWORD="$AGEFREIGHTER_DEV_PASSWORD"
          export AGEFREIGHTER_NEO4J_TEST_DATABASE=neo4j
          make check-full
          make test-compatibility
          make test-connectors-local
          make test-release-integration
          make test-diagnostics-race
          make test-recovery
          ./scripts/bench/release-gate.sh performance-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-performance
          path: performance-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stop PostgreSQL 19 beta target
        if: always()
        run: docker rm --force agefreighter-pg19-beta3 >/dev/null 2>&1 || true
      - name: Stop databases
        if: always()
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-down

  azure:
    needs: prepare
    runs-on: [self-hosted, linux, x64, agefreighter-azure]
    environment: cosmos-integration
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Start local AGE target
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-reset
      - name: Start pinned PostgreSQL 19 beta target
        env:
          PGGRAPH_CONTAINER: agefreighter-pg19-beta3
          PGGRAPH_IMAGE: docker.io/library/postgres@sha256:a48b19841e04b35b72a25e9a94314ac80546d32b5e2e3cd9279390cbd8a99572
          PGGRAPH_PASSWORD: agefreighter_pg19_dev_only
        run: |
          docker pull "$PGGRAPH_IMAGE"
          docker rm --force "$PGGRAPH_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --name "$PGGRAPH_CONTAINER" \
            --publish 55434:5432 \
            --env POSTGRES_PASSWORD="$PGGRAPH_PASSWORD" \
            --env POSTGRES_DB=agefreighter \
            "$PGGRAPH_IMAGE" >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$PGGRAPH_CONTAINER" \
              pg_isready -U postgres -d agefreighter >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$PGGRAPH_CONTAINER"
          exit 1
      - name: Run PostgreSQL 19 property-graph regression
        env:
          AGEFREIGHTER_PGGRAPH_TEST_DSN: postgres://postgres:agefreighter_pg19_dev_only@127.0.0.1:55434/agefreighter?sslmode=disable
        run: make test-pggraph
      - name: Run Cosmos DB live integration
        env:
          AGEFREIGHTER_REQUIRE_COSMOS_TESTS: "1"
          AGEFREIGHTER_PGGRAPH_TEST_DSN: postgres://postgres:agefreighter_pg19_dev_only@127.0.0.1:55434/agefreighter?sslmode=disable
          AGEFREIGHTER_COSMOS_TEST_ENDPOINT: ${{ vars.AGEFREIGHTER_COSMOS_TEST_ENDPOINT }}
          AGEFREIGHTER_COSMOS_TEST_DATABASE: ${{ vars.AGEFREIGHTER_COSMOS_TEST_DATABASE }}
          AGEFREIGHTER_COSMOS_TEST_VERTEX_CONTAINER: ${{ vars.AGEFREIGHTER_COSMOS_TEST_VERTEX_CONTAINER }}
          AGEFREIGHTER_COSMOS_TEST_EDGE_CONTAINER: ${{ vars.AGEFREIGHTER_COSMOS_TEST_EDGE_CONTAINER }}
        run: |
          . ./scripts/dev/services.sh
          export AGEFREIGHTER_AGE_TEST_DSN="postgres://agefreighter:${AGEFREIGHTER_DEV_PASSWORD}@127.0.0.1:${AGE_PORT}/agefreighter?sslmode=disable"
          make test-connectors-cosmos
          make test-connectors-cosmos-pggraph
      - name: Stop PostgreSQL 19 beta target
        if: always()
        run: docker rm --force agefreighter-pg19-beta3 >/dev/null 2>&1 || true
      - name: Stop databases
        if: always()
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-down

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build cross-platform archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          scripts/release/build.sh \
            "$VERSION" "$COMMIT" "$BUILD_DATE" "$GOOS" "$GOARCH" "$PWD/dist"
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.1
      - name: Generate SPDX SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          PATH="$(dirname "$SYFT"):$PATH"
          export PATH
          archive="dist/agefreighter_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
          scripts/release/sbom.sh "$archive" "$archive.spdx.json"
      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-windows:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Windows resource tool
        run: go install github.com/tc-hib/go-winres@v0.3.3
      - name: Build unsigned Windows archive with version resources
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: |
          scripts/release/build.sh \
            "$VERSION" "$COMMIT" "$BUILD_DATE" windows amd64 "$PWD/dist"
      - name: Stage unsigned Windows archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          unsigned="dist/agefreighter_${VERSION}_windows_amd64.zip"
          [[ -f "$unsigned" && ! -L "$unsigned" ]]
          mkdir -p dist/final
          cp "$unsigned" "dist/final/$(basename "$unsigned")"
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.1
      - name: Generate Windows archive SPDX SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          archive="dist/final/agefreighter_${VERSION}_windows_amd64.zip"
          PATH="$(dirname "$SYFT"):$PATH"
          export PATH
          scripts/release/sbom.sh "$archive" "$archive.spdx.json"
      - name: Upload unsigned Windows verification or release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ contains(needs.prepare.outputs.version, '-') && 'verification-windows-amd64' || 'release-windows-amd64' }}
          path: |
            dist/final/*.zip
            dist/final/*.spdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-vscode-extension:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Validate version and install locked dependencies
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "v$(node -p 'require("./package.json").version')" = "$VERSION"
          npm ci
      - name: Test and package VS Code extension
        run: |
          set -euo pipefail
          npm run check
          xvfb-run -a npm run test:host
          npm run package
          vsix=dist/agefreighter-2.3.0.vsix
          unzip -l "$vsix" >dist/vsix-contents.txt
          grep -F 'extension/dist/extension.js' dist/vsix-contents.txt
          if grep -E 'node_modules|\.env|out-test|src/test|\.vscode-test' dist/vsix-contents.txt; then
            printf 'VSIX contains excluded development or secret material\n' >&2
            exit 1
          fi
          npm audit --omit=dev --audit-level=high
          npm sbom --omit=dev --sbom-format spdx >"$vsix.spdx.json"
      - name: Upload VS Code package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-vscode-extension
          path: |
            extensions/vscode/dist/agefreighter-2.3.0.vsix
            extensions/vscode/dist/agefreighter-2.3.0.vsix.spdx.json
            extensions/vscode/dist/vsix-contents.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-macos:
    needs: prepare
    environment: release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, runner: macos-15-intel}
          - {goarch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build macOS archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          scripts/release/build.sh \
            "$VERSION" "$COMMIT" "$BUILD_DATE" darwin "$GOARCH" "$PWD/dist"
      - name: Sign and notarize macOS binaries
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          scripts/release/sign-notarize-macos.sh \
            "dist/agefreighter_${VERSION}_darwin_${GOARCH}.tar.gz" \
            "$VERSION" \
            "$GOARCH"
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.1
      - name: Generate signed archive SPDX SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          PATH="$(dirname "$SYFT"):$PATH"
          export PATH
          archive="dist/agefreighter_${VERSION}_darwin_${GOARCH}.tar.gz"
          scripts/release/sbom.sh "$archive" "$archive.spdx.json"
      - name: Upload signed macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-darwin-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-unix:
    needs: [prepare, build, build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64, runner: macos-15-intel}
          - {goos: darwin, goarch: arm64, runner: macos-15}
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: Extract and execute both native binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          scripts/release/verify.sh \
            "dist/agefreighter_${VERSION}_${GOOS}_${GOARCH}.tar.gz" \
            "$GOOS" "$GOARCH" "$VERSION"

  verify-windows:
    needs: [prepare, build-windows]
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ contains(needs.prepare.outputs.version, '-') && 'verification-windows-amd64' || 'release-windows-amd64' }}
          path: dist
      - name: Confirm unsigned status and execute both native binaries
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Refusing to execute amd64 binaries on $env:PROCESSOR_ARCHITECTURE"
          }
          $archive = "dist/agefreighter_$env:VERSION`_windows_amd64.zip"
          $entries = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($entries.Entries | ForEach-Object { $_.FullName })
            if (($names | Where-Object { $_ -eq "agefreighter.exe" }).Count -ne 1 -or
                ($names | Where-Object { $_ -eq "agefreighter-tools.exe" }).Count -ne 1 -or
                ($names | Where-Object { $_ -eq "LICENSE" }).Count -ne 1 -or
                ($names | Where-Object { $_ -eq "THIRD_PARTY_NOTICES.txt" }).Count -ne 1 -or
                $names.Count -ne 4 -or
                ($names | Where-Object { $_ -match '(^|/)\.\.(/|$)|^/' }).Count -ne 0) {
              throw "Archive content validation failed"
            }
          } finally {
            $entries.Dispose()
          }
          Expand-Archive -LiteralPath $archive -DestinationPath extracted
          $expected = $env:VERSION.Substring(1)
          foreach ($binary in @("agefreighter.exe", "agefreighter-tools.exe")) {
            $signature = Get-AuthenticodeSignature -LiteralPath "./extracted/$binary"
            if ($signature.Status -ne "NotSigned") {
              throw "$binary must be unsigned while Windows signing is deferred"
            }
            $output = & "./extracted/$binary" version
            if ($LASTEXITCODE -ne 0 -or $output -notmatch [regex]::Escape($expected)) {
              throw "$binary version verification failed"
            }
          }

  assemble:
    needs: [prepare, verify-unix, verify-windows, build-vscode-extension]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums and Homebrew formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \) -print | LC_ALL=C sort)
          expected=6
          [[ "$VERSION" == *-* ]] && expected=5
          [[ "${#archives[@]}" -eq "$expected" ]]
          scripts/release/checksum.sh dist/checksums.txt "${archives[@]}"
          scripts/release/generate-formula.sh \
            "$VERSION" "$REPOSITORY" dist dist/agefreighter.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-pre-attestation
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest:
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-pre-attestation
          path: dist
      - name: Attest release assets with GitHub OIDC
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Include attestation bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: cp "$BUNDLE" "dist/agefreighter-${VERSION}.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  homebrew-preflight:
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-pre-attestation
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rioriost/homebrew-cask
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Validate Formula and deploy-key write access without publishing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ruby -c dist/agefreighter.rb
          expected="${VERSION#v}"
          actual="$(sed -n 's/^  version "\(.*\)"$/\1/p' dist/agefreighter.rb)"
          [[ "$actual" == "$expected" ]]
          grep -F 'bin.install "agefreighter"' dist/agefreighter.rb >/dev/null
          grep -F 'bin.install "agefreighter-tools"' dist/agefreighter.rb >/dev/null
          preflight_ref="refs/heads/agefreighter-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C homebrew-tap push --dry-run origin "HEAD:$preflight_ref"

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, quality, azure, attest, homebrew-preflight]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Publish assets to existing validated tag
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          body: >-
            ${{ contains(needs.prepare.outputs.version, '-') &&
            'Windows binaries are intentionally omitted from this prerelease.' ||
            format('Windows amd64 binaries are included without Authenticode signing in {0}. The SignPath Foundation application was not approved, so code signing remains planned for a later release through a future eligible application or another signing arrangement. Verify checksums and GitHub build provenance before use; Windows may display an unknown-publisher or SmartScreen warning.', needs.prepare.outputs.version) }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: dist/*

  publish-homebrew:
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      !contains(needs.prepare.outputs.version, '-')
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: homebrew-tap-agefreighter
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rioriost/homebrew-cask
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Publish formula to rioriost/cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          destination=homebrew-tap/Formula/agefreighter.rb
          incoming="${VERSION#v}"
          if [[ -f "$destination" ]]; then
            current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$destination")"
            [[ "$current" =~ ^2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            comparison="$(ruby -rrubygems -e \
              'puts Gem::Version.new(ARGV[0]) <=> Gem::Version.new(ARGV[1])' \
              "$incoming" "$current")"
            if [[ "$comparison" -lt 0 ]]; then
              printf 'Keeping newer Formula %s instead of %s\n' \
                "$current" "$incoming"
              exit 0
            fi
            if [[ "$comparison" -eq 0 ]]; then
              cmp --silent dist/agefreighter.rb "$destination" || {
                printf 'Formula %s already exists with different content\n' \
                  "$incoming" >&2
                exit 1
              }
              printf 'Formula already matches %s\n' "$VERSION"
              exit 0
            fi
          fi
          install -D -m 0644 dist/agefreighter.rb \
            "$destination"
          cd homebrew-tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/agefreighter.rb
          git diff --cached --quiet -- Formula/agefreighter.rb && {
            printf 'Formula already matches %s\n' "$VERSION"
            exit 0
          }
          git commit -m "Update agefreighter to ${VERSION#v}"
          git pull --rebase origin main
          git push origin HEAD:main
