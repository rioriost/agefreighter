name: Release performance

on:
  workflow_dispatch:

concurrency:
  group: release-performance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start pinned benchmark database
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-up
      - name: Enforce release performance budgets
        env:
          AGEFREIGHTER_MINIMUM_CSV_ROWS_PER_SECOND: "50000"
        run: |
          . ./scripts/dev/services.sh
          export AGEFREIGHTER_AGE_TEST_DSN="postgres://agefreighter:${AGEFREIGHTER_DEV_PASSWORD}@127.0.0.1:${AGE_PORT}/agefreighter?sslmode=disable"
          ./scripts/bench/release-gate.sh performance-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-performance
          path: performance-artifacts/
          if-no-files-found: error
      - name: Stop databases
        if: always()
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-down
