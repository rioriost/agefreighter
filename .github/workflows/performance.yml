name: Release performance

on:
  workflow_dispatch:
  push:
    tags:
      - "v2.*"

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start pinned benchmark database
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-up
      - name: Enforce release performance budgets
        env:
          AGEFREIGHTER_MINIMUM_CSV_ROWS_PER_SECOND: "50000"
        run: |
          . ./scripts/dev/services.sh
          export AGEFREIGHTER_AGE_TEST_DSN="postgres://agefreighter:${AGEFREIGHTER_DEV_PASSWORD}@127.0.0.1:${AGE_PORT}/agefreighter?sslmode=disable"
          ./scripts/bench/release-budget.sh performance-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-performance
          path: performance-artifacts/
          if-no-files-found: error
      - name: Stop databases
        if: always()
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-down
