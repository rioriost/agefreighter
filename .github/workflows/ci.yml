name: CI

on:
  pull_request:
  push:
    branches:
      - 2.0.0

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned tools
        run: make install-tools
      - name: Run full quality gate
        run: make check-full
