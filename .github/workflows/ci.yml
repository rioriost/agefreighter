name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "2.1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned tools
        run: make install-tools
      - name: Run database-independent quality gate
        run: make check

  development-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start pinned development databases
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-up
      - name: Verify idempotent startup
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-up
      - name: Verify volume-preserving stop and restart
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: |
          make dev-down
          make dev-up
      - name: Verify deterministic reset
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-reset
      - name: Start pinned PostgreSQL 19 beta target
        env:
          PGGRAPH_CONTAINER: agefreighter-pg19-beta3
          PGGRAPH_IMAGE: docker.io/library/postgres@sha256:a48b19841e04b35b72a25e9a94314ac80546d32b5e2e3cd9279390cbd8a99572
          PGGRAPH_PASSWORD: agefreighter_pg19_dev_only
        run: |
          docker pull "$PGGRAPH_IMAGE"
          docker rm --force "$PGGRAPH_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --name "$PGGRAPH_CONTAINER" \
            --publish 55434:5432 \
            --env POSTGRES_PASSWORD="$PGGRAPH_PASSWORD" \
            --env POSTGRES_DB=agefreighter \
            "$PGGRAPH_IMAGE" >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$PGGRAPH_CONTAINER" \
              pg_isready -U postgres -d agefreighter >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$PGGRAPH_CONTAINER"
          exit 1
      - name: Run AGE integration and coverage gate
        env:
          AGEFREIGHTER_AGE_TEST_DSN: postgres://agefreighter:agefreighter_dev_only@127.0.0.1:55432/agefreighter?sslmode=disable
          AGEFREIGHTER_PGGRAPH_TEST_DSN: postgres://postgres:agefreighter_pg19_dev_only@127.0.0.1:55434/agefreighter?sslmode=disable
        run: |
          export AGEFREIGHTER_POSTGRES_TEST_DSN='postgres://agefreighter:agefreighter_dev_only@127.0.0.1:55433/agefreighter?sslmode=disable'
          export AGEFREIGHTER_NEO4J_TEST_URI='bolt://127.0.0.1:57687'
          export AGEFREIGHTER_NEO4J_TEST_USERNAME='neo4j'
          export AGEFREIGHTER_NEO4J_TEST_PASSWORD='agefreighter_dev_only'
          export AGEFREIGHTER_NEO4J_TEST_DATABASE='neo4j'
          go test -race ./internal/age ./internal/source/postgres ./internal/source/neo4j
          make coverage
          make test-connectors-local
          make test-release-integration
          make test-diagnostics-race
          make test-recovery
      - name: Stop PostgreSQL 19 beta target
        if: always()
        run: docker rm --force agefreighter-pg19-beta3 >/dev/null 2>&1 || true
      - name: Stop databases
        if: always()
        env:
          DEV_RUNTIME: docker
          DEV_PLATFORM: linux/amd64
        run: make dev-down
