name: VS Code Extension

on:
  pull_request:
    paths:
      - "extensions/vscode/**"
      - "internal/cli/config_commands.go"
      - "internal/cli/root_test.go"
      - "internal/config/**"
      - "internal/runner/**"
      - "go.mod"
      - "go.sum"
      - "docs/reference/vscode-extension*.md"
      - ".github/workflows/vscode-extension.yml"
  push:
    branches:
      - main
      - "2.3.0"
      - "codex/2.4.0-guided-migration"
    paths:
      - "extensions/vscode/**"
      - "internal/cli/config_commands.go"
      - "internal/cli/root_test.go"
      - "internal/config/**"
      - "internal/runner/**"
      - "go.mod"
      - "go.sum"
      - "docs/reference/vscode-extension*.md"
      - ".github/workflows/vscode-extension.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, unit test, and bundle
        run: npm run check
      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
        working-directory: extensions/vscode
      - name: Build real CLI for configuration contract tests
        run: go build -o "$RUNNER_TEMP/agefreighter-source-contract" ./cmd/agefreighter
      - name: Validate all GUI source formats with the Go engine
        working-directory: extensions/vscode
        env:
          AGEFREIGHTER_TEST_BINARY: ${{ runner.temp }}/agefreighter-source-contract
        run: npm run test:source-contract

  extension-host:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run Extension Host smoke test
        env:
          VSCODE_TEST_VERSION: "1.105.0"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xvfb-run -a npm run test:host; then
              exit 0
            fi
            [[ "$attempt" -lt 3 ]] && sleep $((attempt * 10))
          done
          exit 1

  package:
    needs: [unit, source-contract, extension-host]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Package and inspect VSIX
        id: package
        run: |
          set -euo pipefail
          npm run package
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          vsix="dist/agefreighter-$version.vsix"
          test -f "$vsix"
          unzip -l "$vsix" >dist/vsix-contents.txt
          grep -F 'extension/dist/extension.js' dist/vsix-contents.txt
          if grep -E 'node_modules|\.env|out-test|src/test|\.vscode-test' dist/vsix-contents.txt; then
            printf 'VSIX contains excluded development or secret material\n' >&2
            exit 1
          fi
          sha256sum "$vsix" >"$vsix.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agefreighter-vscode-${{ steps.package.outputs.version }}
          path: |
            extensions/vscode/dist/agefreighter-${{ steps.package.outputs.version }}.vsix
            extensions/vscode/dist/agefreighter-${{ steps.package.outputs.version }}.vsix.sha256
            extensions/vscode/dist/vsix-contents.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
